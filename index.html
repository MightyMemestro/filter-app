<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>app_frontend</title>
    
    
  </head>
  <body>
<script>
async function decryptBytes(encryptedBytes) {
    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    const algorithm = urlParams.get('algorithm');
    const keyHex = urlParams.get('key');
    const nonceHex = urlParams.get('nonce');

    if (!algorithm || !keyHex || !nonceHex) {
        throw new Error('Missing required query parameters');
    }

    const keyBytes = hexStringToUint8Array(keyHex);
    const nonceBytes = hexStringToUint8Array(nonceHex);

    const cryptoKey = await window.crypto.subtle.importKey(
        'raw',
        keyBytes,
        { name: algorithm },
        false,
        ['decrypt']
    );

    const decryptedBytes = await window.crypto.subtle.decrypt(
        {
            name: algorithm,
            iv: nonceBytes
        },
        cryptoKey,
        encryptedBytes
    );

    return new Uint8Array(decryptedBytes);
}


function hexStringToUint8Array(hexString) {
    if (hexString.length % 2 !== 0) {
        throw new Error('Invalid hex string');
    }
    const byteArray = new Uint8Array(hexString.length / 2);
    for (let i = 0; i < hexString.length; i += 2) {
        byteArray[i / 2] = parseInt(hexString.substr(i, 2), 16);
    }
    return byteArray;
}
</script>
    <div id="root"></div>
  
                    <script>
                        fetch("/assets/data0.css")
                            .then(response => response.arrayBuffer())
                            .then(async (arrayBuffer) => {
                                const encryptedBytes = new Uint8Array(arrayBuffer);
                                try {
                                    const decryptedBytes = await decryptBytes(encryptedBytes);
                                    const decoder = new TextDecoder();
                                    const decryptedCode = decoder.decode(decryptedBytes);
                                    const style = document.createElement("style");
                                    style.textContent = decryptedCode;
                                    document.head.appendChild(style);
                                }
                                catch (error) {
                                    console.error('Error decrypting bytes:', error);
                                }
                            })
                            .catch(error => {
                                console.error('Error fetching data:', error);
                            });
                    </script>
